[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simca"
version = "0.1.0"
description = "Offline least-squares calibration of guidance weights for diffusion and flow-matching posterior sampling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
